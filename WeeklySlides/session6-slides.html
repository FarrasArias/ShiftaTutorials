# Sound as Material

.subtitle[Oscillators, envelopes, spectra, filters, microphones, and generative music in p5.js]

---
class: dark-slide

## Where we've been

.two-col[
.box[
### Weeks 1–3
Drawing, animation, time, user input.
Conditionals, loops, functions.
Randomness and Perlin noise.
]
.box[
### Weeks 4–5
Data as creative material.
Arrays, objects, classes.
Trig, recursion, modulo, map().
]
]

.box-orange[
### Week 6: Sound
**Sound is data.** Amplitude is a number. Frequency is a number. A waveform is an array. Everything you already know applies: the input is just your ears now.
]

---
class: section-slide

# Sound Synthesis
## What sound is and how to make it

---

## What is sound?

Sound is **pressure waves** moving through air. A vibrating object pushes air molecules back and forth: those compressions travel outward as a wave.

.two-col[
.box[
**Amplitude**: how much the air pressure changes. We hear this as **loudness**.

**Frequency**: how many times per second the wave cycles. We hear this as **pitch**.

1 cycle/second = 1 Hz. Human hearing: roughly 20 Hz to 20,000 Hz (20 kHz).
]
.box[
**Digital audio** samples the waveform thousands of times per second.

Standard rate: **44,100 samples/second** (44.1 kHz). That's one sample every ~23 microseconds.

**Nyquist theorem**: to represent a frequency, you need at least 2× as many samples per second. At 44.1 kHz we can capture up to 22.05 kHz: just above human hearing.
]
]

---

## Adding p5.sound

p5.sound is a **separate library**: not included by default.

In the **p5.js web editor**, open `index.html` and add:

```html
<!-- after the p5.js script tag -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
```

Or use **Sketch › Add Library** and search "p5.sound" in the editor sidebar.

.box-teal[
**Important:** browsers block audio until the user interacts with the page. Always start sound playback inside `mousePressed()` or `keyPressed()`: never in `setup()` or `draw()` directly.
]

---

## p5.Oscillator: making tones

An **oscillator** generates a continuous periodic waveform. It is the fundamental unit of synthesis.

```javascript
let osc;

function setup() {
  createCanvas(400, 400);
  osc = new p5.Oscillator('sine');  // 'sine' 'triangle' 'sawtooth' 'square'
  osc.amp(0);    // start silent
  osc.freq(440); // 440 Hz = concert A
}

function mousePressed() {
  osc.start();
  osc.amp(0.5, 0.1);  // fade to 0.5 over 0.1 seconds
}

function mouseReleased() {
  osc.amp(0, 0.3);  // fade out over 0.3 seconds
}
```

.box-green[
**Always fade in and out.** Instantaneous amplitude changes cause audible clicks (a DC discontinuity). Use the ramp argument: `osc.amp(value, rampTime)`.
]

.dim[→ [Sketch 01: Basic oscillator](https://editor.p5js.org/rafael.arias.glez/sketches/ooMSt9rRo)]

---

## Waveform shapes

.three-col[
.box[
**Sine**
Pure tone. Only one frequency component.
Warm, flute-like.
`'sine'`
]
.box[
**Triangle**
Odd harmonics, low amplitude.
Hollow, woody.
`'triangle'`
]
.box[
**Sawtooth**
All harmonics present.
Bright, buzzy, rich.
Synthesizer strings.
`'sawtooth'`
]
]

.box[
**Square**: odd harmonics only, hollow and reedy, like a clarinet. `'square'`

The waveform shape is a **timbre** decision. The same pitch on a sine and a sawtooth sound completely different because they contain different frequencies.
]

---

## Why waveforms sound different: harmonics

A pure sine wave has **one frequency**. Every other waveform is built from **multiple sine waves added together**.

.two-col[
.box[
**Harmonic series**
A note at 220 Hz (A3) has partials at:
- 220 Hz (fundamental)
- 440 Hz (2nd harmonic: octave)
- 660 Hz (3rd harmonic: fifth)
- 880 Hz (4th harmonic: octave again)
- ...

The **relative amplitudes** of these partials determine timbre.
]
.box[
**By waveform type**
- **Sawtooth**: all harmonics at amplitude 1/n
- **Square**: only odd harmonics (1st, 3rd, 5th...)
- **Triangle**: odd harmonics, amplitude 1/n²
- **Sine**: only the fundamental

This is why the FFT shows different "recipes" for each wave type.
]
]

.dim[→ [Sketch 02: Beating / detuning](https://editor.p5js.org/rafael.arias.glez/sketches/nNC_-JrDF)]

---

## Loading sound files

```javascript
let song;

function preload() {
  song = loadSound('audio.mp3');  // load before setup() runs
}

function setup() {
  createCanvas(400, 400);
}

function mousePressed() {
  if (song.isPlaying()) {
    song.pause();
  } else {
    song.play();
  }
}
```

.box[
**Sound properties:** `song.setVolume(0.5)`, `song.rate(0.8)` (changes speed + pitch), `song.pan(-0.5)` (-1 left, 1 right), `song.loop()`, `song.duration()`, `song.currentTime()`

Free sources: freesound.org · samplefocus.com · splice.com (free tier)
]

class: section-slide

# Envelopes & Timbre
## Shaping sound over time

---

## The ADSR envelope

Every note you hear has a shape over time: it fades in, peaks, settles, and fades out. This is the **envelope**.

.two-col[
.box[
**A: Attack** (seconds)
Time from silence to peak amplitude.
Short: percussive. Long: swells in slowly.

**D: Decay** (seconds)
Time from peak down to sustain level.

**S: Sustain** (0 to 1)
Amplitude while the note is held.

**R: Release** (seconds)
Time from sustain to silence after release.
]
.box[
```javascript
env = new p5.Envelope();
env.setADSR(
  0.05,   // attack: 50ms
  0.1,    // decay: 100ms
  0.6,    // sustain: 60% of peak
  0.4     // release: 400ms
);
env.setRange(0.8, 0);  // peak, end amplitude

// Trigger the note:
osc.freq(440);
env.play(osc);
```

Every synthesizer since the 1960s uses ADSR. It is the universal language of synthesis.
]
]

.dim[→ [Sketch 04: ADSR controls](https://editor.p5js.org/rafael.arias.glez/sketches/Z1uIp-2lH)]

---

## Envelope presets: different instrument textures

The same oscillator sounds completely different with different envelope settings:

.two-col[
```javascript
// Plucked string (guitar, harp)
env.setADSR(0.001, 0.3, 0.0, 0.1);
// Fast attack, no sustain: note dies immediately

// Pad (strings, synth pads)
env.setADSR(0.8, 0.2, 0.7, 1.5);
// Slow attack, long release: swells in and out

// Bell / vibraphone
env.setADSR(0.001, 0.5, 0.1, 1.2);
// Instant attack, long ring-out

// Swell (reverse effect)
env.setADSR(1.5, 0.1, 0.8, 0.3);
// Very slow attack: fades in from silence
```

.box-orange[
The oscillator waveform sets *what* frequencies are present. The envelope sets *how* they evolve in time. These two decisions together create the identity of a sound.
]
]

.dim[→ [Sketch 05: Envelope presets](https://editor.p5js.org/rafael.arias.glez/sketches/CyQcw6Dda)]

---

## Additive synthesis: building sounds from sine waves

Any waveform can be approximated by adding sine waves. We can build complex tones from scratch:

```javascript
let oscs = [];
let amps = [1, 0.5, 0.33, 0.25, 0.2];  // amplitude of each harmonic

function setup() {
  let baseFreq = 220;
  for (let i = 0; i < 5; i++) {
    let o = new p5.Oscillator('sine');
    o.freq(baseFreq * (i + 1));  // 220, 440, 660, 880, 1100 Hz
    o.amp(0);
    o.start();
    oscs.push(o);
  }
}

function mousePressed() {
  for (let i = 0; i < oscs.length; i++) {
    let env = new p5.Envelope();
    env.setADSR(0.01, 0.1, 0.5, 0.3);
    env.setRange(amps[i] * 0.3, 0);
    env.play(oscs[i]);
  }
}
```

.dim[→ [Sketch 06: Additive synthesis](https://editor.p5js.org/rafael.arias.glez/sketches/nbz7Qbh2E)]

---

## p5.Noise: all frequencies at once

Noise generators produce sound with **no pitch**: useful for percussion, texture, and ambience.

```javascript
let noise, env;

function setup() {
  noise = new p5.Noise('white');  // 'white' 'pink' 'brown'
  noise.amp(0);
  noise.start();
  env = new p5.Envelope();
  env.setADSR(0.001, 0.1, 0, 0.05);  // snare-like
  env.setRange(0.5, 0);
}
```

.three-col[
.box[
**White noise**
Equal energy at every frequency.
Hiss, static, rain on a tin roof.
]
.box[
**Pink noise**
Energy falls at higher frequencies.
More natural. Waterfalls, wind.
]
.box[
**Brown noise**
Even more bass-heavy.
Rumble, thunder, distant ocean.
]
]

class: section-slide

# Scales & Frequency
## The mathematics of pitch

---

## Pitch is a ratio, not a number

The frequency of A4 is 440 Hz. But what makes two notes sound related is their **ratio**:

.two-col[
.box[
**Pure (just) intervals**

| Interval | Ratio | Example |
|----------|-------|---------|
| Unison | 1:1 | 220 / 220 Hz |
| Octave | 2:1 | 440 / 220 Hz |
| Fifth | 3:2 | 330 / 220 Hz |
| Fourth | 4:3 | 293 / 220 Hz |
| Major third | 5:4 | 275 / 220 Hz |

These simple ratios produce **consonant** sounds because the waveforms align periodically.
]
.box[
```javascript
let base = 220;

// Just intonation: pure ratios
let fifth   = base * (3/2);   // 330 Hz
let fourth  = base * (4/3);   // 293.3 Hz
let majThird = base * (5/4);  // 275 Hz
let minThird = base * (6/5);  // 264 Hz

// Play them together:
osc1.freq(base);
osc2.freq(fifth);
// → sounds perfectly in tune
```

.dim[→ [Sketch 08: Frequency ratios](https://editor.p5js.org/rafael.arias.glez/sketches/XbDDnGNXj)]
]
]

---

## 12-TET: equal temperament

Just intonation sounds pure but doesn't work across all keys. **12-TET** is a compromise: divide the octave into 12 equal steps, each multiplying frequency by $$r = 2^{1/12} \approx 1.05946$$

So the frequency of semitone `k` above a base frequency `f₀` is: $$f_k = f_0 \times 2^{k/12}$$

```javascript
let baseFreq = 220;

function stepToFreq(step) {
  return baseFreq * pow(2, step / 12);
}

// C major scale (steps from A): 3, 5, 7, 8, 10, 12, 14, 15
let cMajor = [3, 5, 7, 8, 10, 12, 14, 15];
let freqs  = cMajor.map(s => stepToFreq(s));
```

.box-teal[
12-TET slightly mistunes every interval except the octave (e.g., a fifth is 1.4983× instead of 1.5×). The error is small enough that most listeners don't notice: but it accumulates across instruments in a large ensemble.
]

.dim[→ [Sketch 09: 12-TET keyboard](https://editor.p5js.org/rafael.arias.glez/sketches/mHfZpFq6w)]

---

## N-TET: microtonal systems

**N-TET** divides the octave into N equal steps. $$f_k = f_0 \times 2^{k/N}$$

When N = 12 you get standard tuning. Change N for entirely different pitch palettes:

.two-col[
.box[
**19-TET**: 19 steps/octave
Better major thirds than 12-TET (very close to pure 5:4). Slightly narrower fifths. Used by many microtonal composers.

**31-TET**: 31 steps/octave
Excellent approximations of just intervals. Rich, lush sound. Close to quarter-tone temperament.

**53-TET**: 53 steps/octave
Near-perfect approximation of just intonation. Each step is tiny (~23 cents).
]
.box[
```javascript
let N = 19;
let baseFreq = 220;

// A scale subset from 19-TET
// (similar to major but with microtonal color)
let scale = [0, 3, 6, 8, 11, 14, 17];

function playStep(step) {
  let freq = baseFreq * pow(2, step / N);
  osc.freq(freq);
  env.play(osc);
}
```

Microtonal ≠ "out of tune." It means **more colors on the palette**.
]
]

.dim[→ [Sketch 10: N-TET explorer](https://editor.p5js.org/rafael.arias.glez/sketches/JjrY9HIul)]

# Spectral Analysis
## Seeing inside sound with the FFT

---

## Time domain vs frequency domain

There are two ways to represent any sound:

.two-col[
.box[
**Time domain**: amplitude over time

The raw waveform: what the speaker cone is physically doing moment to moment.

Answers: *what does the sound look like right now?*

`fft.waveform()`: array of 1024 values from -1 to 1
]
.box[
**Frequency domain**: amplitude at each frequency

The spectrum: a bar chart showing how much energy is at each frequency.

Answers: *what frequencies make up this sound?*

`fft.analyze()`: array of 1024 values from 0 to 255
]
]

.box-orange[
The **Fourier Transform** converts between these two representations. The FFT (Fast Fourier Transform) is the efficient algorithm that makes this possible in real time. Given N audio samples, it produces N/2 frequency bins.
]

---

## p5.FFT: setup and use

```javascript
let fft;

function setup() {
  // smoothing: 0.0–1.0 (higher = smoother, slower response)
  // bins: 16/32/64/128/256/512/1024 (more = finer resolution)
  fft = new p5.FFT(0.8, 1024);
  song.loop();
}

function draw() {
  let waveform = fft.waveform();   // time domain: -1 to 1
  let spectrum = fft.analyze();    // frequency domain: 0 to 255
}
```

.box-teal[
With 1024 bins at 44,100 Hz sample rate: each bin covers ≈ 43 Hz. We get 512 usable bins from 0 Hz to ~22,050 Hz. Lower bins = bass, higher bins = treble. A sawtooth at 220 Hz shows spikes at 220, 440, 660, 880 Hz: exactly the harmonic series.
]

---

## Drawing a waveform

```javascript
function draw() {
  background(10);

  let wave = fft.waveform();

  noFill();
  stroke(79, 197, 247);
  strokeWeight(1.5);
  beginShape();
  for (let i = 0; i < wave.length; i++) {
    let x = map(i, 0, wave.length, 0, width);
    let y = map(wave[i], -1, 1, 0, height);
    vertex(x, y);
  }
  endShape();
}
```

.box-orange[
**`beginShape()` / `vertex()` / `endShape()`** draws a connected line through a series of points. At low frequencies you can see individual wave cycles. At high frequencies the cycles compress together. Waveform type is visible: sine = smooth curve, sawtooth = zigzag ramp, square = flat plateaus.
]

.dim[→ [Sketch 11: Waveform](https://editor.p5js.org/rafael.arias.glez/sketches/iIG22nJgQ)]

---

## Drawing a frequency spectrum

```javascript
function draw() {
  background(10);
  colorMode(HSB, 360, 100, 100);

  let spectrum = fft.analyze();  // 1024 values, 0–255

  noStroke();
  for (let i = 0; i < spectrum.length; i++) {
    let x = map(i, 0, spectrum.length, 0, width);
    let h = map(spectrum[i], 0, 255, 0, height);
    let hue = map(i, 0, spectrum.length, 0, 260);
    fill(hue, 80, 80);
    rect(x, height - h, width / spectrum.length, h);
  }
}
```

A sine wave at 220 Hz → **single spike**. A sawtooth → **spike at 220, then at 440, 660, 880...** each shorter (amplitude = 1/n). This is the FFT literally showing you the recipe of the waveform.

.dim[→ [Sketch 12: Spectrum](https://editor.p5js.org/rafael.arias.glez/sketches/CiRIBcq72)]

---

## Named frequency bands

Rather than reading all 1024 spectrum values, query specific musical ranges directly:

```javascript
// Must call fft.analyze() first each frame
fft.analyze();

let bass    = fft.getEnergy('bass');     // 20–140 Hz   → kick drum, bass guitar
let lowMid  = fft.getEnergy('lowMid');   // 140–400 Hz  → low vocals, cello
let mid     = fft.getEnergy('mid');      // 400–2600 Hz → vocals, most instruments
let highMid = fft.getEnergy('highMid');  // 2600–5200 Hz → presence, attack
let treble  = fft.getEnergy('treble');   // 5200–14000 Hz → hi-hats, sibilance

// Or specify exact Hz range:
let sub = fft.getEnergy(20, 80);  // sub-bass

// All return 0–255
```

.box-green[
This is how audio-reactive visuals work: **bass → pulsing mass. Mid → orbiting ring. Treble → sparkles.** Each frequency band drives a different visual layer, so every element of a music track has its own visual counterpart.
]

# Filters & Effects
## Shaping and processing sound

---

## What are filters?

An audio filter **selectively removes frequencies** from a sound. The sonic equivalent of a color filter on a camera.

.three-col[
.box[
**Low-pass (LPF)**
Passes frequencies *below* cutoff.
Attenuates above.
Darker, warmer, muffled.
*Music through a wall.*
]
.box[
**High-pass (HPF)**
Passes frequencies *above* cutoff.
Removes bass.
Thinner, brighter.
*A telephone line.*
]
.box[
**Band-pass (BPF)**
Passes a *band* around a center.
Attenuates outside.
*Tuning a radio.*
]
]

.box[
**Resonance (Q)**: a boost at the cutoff frequency. High resonance = the filter "rings" at the cutoff. This is the classic synthesizer filter sweep sound: that "wah" effect.
]

---

## p5.Filter and signal chains

Audio modules connect in series: **source → filter → effects → speakers**

```javascript
let osc, filter;

function setup() {
  osc = new p5.Oscillator('sawtooth');
  osc.amp(0.5);
  osc.freq(220);
  osc.start();

  filter = new p5.Filter('lowpass');
  filter.set(800, 10);  // cutoff Hz, resonance Q

  // Disconnect osc from default output, send through filter
  osc.disconnect();
  osc.connect(filter);
  // filter output → speakers by default
}

function draw() {
  // Mouse sweeps the cutoff frequency
  let cutoff = map(mouseX, 0, width, 80, 10000);
  let res    = map(mouseY, height, 0, 1, 20);
  filter.set(cutoff, res);
}
```

.dim[→ [Sketch 15: Filter sweep](https://editor.p5js.org/rafael.arias.glez/sketches/oAcidoJfM): move mouse left/right to sweep, up for resonance]

---

## Delay

**Delay** records the incoming signal and plays it back after a set time, creating repeating echoes.

```javascript
let osc, delay;

function setup() {
  osc = new p5.Oscillator('triangle');
  osc.amp(0.5);
  osc.start();

  delay = new p5.Delay();
  // process(source, delayTime, feedback, filterFreq)
  delay.process(osc, 0.25, 0.6, 3000);
  // 0.25s delay, 60% feedback (echoes fade slowly),
  // low-pass at 3kHz (each echo gets darker: like real echoes)
}
```

.two-col[
.box[
**Delay time**: seconds before the echo plays. Synced to BPM: 120 BPM = 0.5s per beat.
]
.box[
**Feedback**: how much echo feeds back in. At 0: single echo. Near 1: infinite repeating echoes.
]
]

.dim[→ [Sketch 16: Delay effect](https://editor.p5js.org/rafael.arias.glez/sketches/ImicH9Tgm)]

---

## Reverb

**Reverb** simulates sound reflecting off surfaces in a physical space. The single most important effect for making synthesized sounds feel "present" and real.

```javascript
let osc, reverb;

function setup() {
  osc = new p5.Oscillator('sine');
  osc.amp(0.5);
  osc.start();

  reverb = new p5.Reverb();
  // process(source, reverbTime, decayRate)
  reverb.process(osc, 3, 2);
  // 3 second tail, decay rate 2
}
```

.two-col[
.box-teal[
`reverbTime`: how long the reverb tail lasts (seconds).
0.5 = small room. 3–5 = concert hall. 10+ = cathedral.
]
.box-teal[
`decayRate`: how quickly it fades.
Higher = faster decay. Lower = longer, denser bloom.
]
]

.box[
Chain: `osc → filter → delay → reverb → speakers`. Order matters: filtering before reverb sounds different from reverb before filter.
]

.dim[→ [Sketch 17: Reverb effect](https://editor.p5js.org/rafael.arias.glez/sketches/a2jV5K_FC)]

# Microphone & Reactivity
## Sound as real-time input

---

## p5.AudioIn: listening to the world

```javascript
let mic, amp;

function setup() {
  createCanvas(400, 400);
  mic = new p5.AudioIn();
  mic.start();  // browser asks for microphone permission

  amp = new p5.Amplitude();
  amp.setInput(mic);
}

function draw() {
  background(10);
  let level = amp.getLevel();  // 0.0 → ~1.0

  // Calibrate: normal room sounds produce 0.01–0.1
  // Map from 0–0.3, not 0–1, for more responsive visuals
  let d = map(level, 0, 0.3, 10, width * 0.9);
  noStroke();
  fill(197, 247, 79, 180);
  circle(width/2, height/2, d);
}
```

.box-orange[
Works only over **HTTPS** or **localhost**. The p5.js web editor runs on HTTPS. `amp.getLevel()` returns RMS amplitude: a smoothed loudness measure.
]

.dim[→ [Sketch 18: Amplitude reactive](https://editor.p5js.org/rafael.arias.glez/sketches/2L5hccAdc)]

---

## Smoothing: taming jittery data

Raw amplitude changes rapidly and can make visuals jitter. Two approaches:

```javascript
// 1. Built-in smoothing: 0 (fast/jittery) → 1 (slow/smooth)
amp = new p5.Amplitude(0.9);  // high smoothing

// 2. Manual lerp: more control per parameter
let smoothLevel = 0;

function draw() {
  let rawLevel = amp.getLevel();
  // lerp toward the new value by (1 - smoothing) each frame
  smoothLevel = lerp(smoothLevel, rawLevel, 0.15);

  // Use different smoothing for different elements:
  // Fast smoothing → punchy flash on a beat
  // Slow smoothing → background color drifts gradually
}
```

.box-teal[
**`lerp(a, b, t)`** moves `a` toward `b` by fraction `t` each frame. With `t = 0.15`, each frame closes 15% of the remaining gap. The result is an exponential approach: smooth but responsive.
]

---

## FFT on microphone input

Connect the FFT to the microphone for real-time spectral analysis of whatever is in the room:

```javascript
let mic, fft;

function setup() {
  mic = new p5.AudioIn();
  mic.start();

  fft = new p5.FFT();
  fft.setInput(mic);  // analyze the mic, not a song
}

function draw() {
  let spectrum = fft.analyze();

  for (let i = 0; i < spectrum.length; i++) {
    let x = map(i, 0, spectrum.length, 0, width);
    let h = map(spectrum[i], 0, 255, 0, height);
    rect(x, height - h, width / spectrum.length, h);
  }
}
```

A whistle → sharp peak at one frequency. A clap → broad burst across all. Speech → energy in 100–4000 Hz with moving formant peaks.

.dim[→ [Sketch 19: Mic FFT](https://editor.p5js.org/rafael.arias.glez/sketches/QaQ_0NrZi)]

---

## Multi-parameter mapping and beat detection

Map multiple frequency bands to multiple visual parameters simultaneously:

```javascript
function draw() {
  fft.analyze();

  let bass   = fft.getEnergy('bass');    // 0–255
  let mid    = fft.getEnergy('mid');
  let treble = fft.getEnergy('treble');

  // Bass → pulsing center mass
  let size = map(bass, 0, 255, 20, 300);
  circle(cx, cy, size);

  // Beat detection: amplitude crosses a threshold
  let level = amp.getLevel();
  if (level > 0.15 && millis() - lastBeat > 200) {
    onBeat();              // flash, spawn particles, change color
    lastBeat = millis();   // cooldown prevents double-triggers
  }
}
```

# Generative Music
## Systems that compose on their own

---

## Random melody with timing

The simplest generative music: pick random notes at random intervals.

```javascript
let osc, env;
let scale = [0, 2, 4, 7, 9];  // pentatonic: no dissonant combinations
let baseFreq = 220;
let nextNote = 0;

function setup() {
  osc = new p5.Oscillator('sine');
  osc.amp(0); osc.start();
  env = new p5.Envelope();
  env.setADSR(0.01, 0.15, 0.1, 0.3);
  env.setRange(0.4, 0);
}

function draw() {
  if (millis() > nextNote) {
    let step = random(scale);
    let octave = floor(random(3));
    osc.freq(baseFreq * pow(2, (step + octave * 12) / 12));
    env.play(osc);
    nextNote = millis() + random(150, 600);  // irregular timing
  }
}
```

.dim[→ [Sketch 21: Random melody](https://editor.p5js.org/rafael.arias.glez/sketches/tykg4-5ic)]

---

## Weighted random selection

Pure randomness gives every note an equal chance: flat and aimless. Real music has **tendencies**: some notes appear more often, melodies prefer small steps.

```javascript
function weightedRandom(items, weights) {
  let total = weights.reduce((a, b) => a + b, 0);
  let r = random(total);
  let sum = 0;
  for (let i = 0; i < items.length; i++) {
    sum += weights[i];
    if (r < sum) return items[i];
  }
  return items[items.length - 1];
}

// Root (0) and fifth (7) appear more often
let notes   = [0, 2, 4, 7, 9];
let weights = [4, 1, 2, 3, 1];
let step = weightedRandom(notes, weights);
```

.box-teal[
By biasing toward the root and fifth, the melody gravitates toward "home" tones: creating a sense of key and stability even though the sequence is random.
]

---

## Markov chains: memory in randomness

A **Markov chain** adds a form of memory: the next note depends on the *current* note.

```javascript
let transitions = {
  0: [0, 2, 4, 7],    // from root: can go anywhere
  2: [0, 4, 4, 2],    // from 2nd: tends toward 3rd
  4: [2, 7, 7, 4],    // from 3rd: tends toward 5th
  7: [0, 0, 4, 9],    // from 5th: tends back to root
  9: [7, 7, 0, 4]     // from 6th: tends toward 5th
};

let currentNote = 0;

function nextNote() {
  let options = transitions[currentNote];
  currentNote = random(options);  // pick from this note's options
  return currentNote;
}
```

.box-green[
Result: **local coherence**: the melody moves in steps rather than jumps, gravitates toward pitch centers, but stays unpredictable at the global level. Much closer to how real melodies work than pure randomness.
]

---

## Step sequencer and the ambient generator

A **step sequencer** plays notes at regular intervals (a steady tempo pulse). Each step can hold a note, a rest, or different parameters:

```javascript
let sequence = [0, -1, 3, 7, -1, 3, 11, 7];  // -1 = rest
let step = 0;
let bpm = 120;
let stepInterval = 60000 / bpm / 2;  // eighth notes in ms

function draw() {
  if (millis() > nextStep) {
    if (sequence[step] !== -1) {
      playNote(sequence[step]);
    }
    step = (step + 1) % sequence.length;
    nextStep = millis() + stepInterval;
  }
}
```

.box-orange[
**Design principles for generative music:**
Constrain the pitch palette (pentatonic = always harmonic) · Vary rhythm not just notes · Use silence (25% rests changes everything) · Layer slow drones with fast gestures · Let reverb/delay do the texture work
]

## Artists working with sound

.two-col[
.box[
**Alvin Lucier**: *I Am Sitting in a Room* (1969). A voice, re-recorded in a room until the room's resonant frequencies replace all intelligible speech. The room is the instrument.

**Ryoji Ikeda**: ultra-precise data-to-sound-to-image. Test tones, scanning frequencies, pixel-level visualizations that treat audio as information architecture.
]
.box[
**Brian Eno**: *Discreet Music* (1975), *Music for Airports* (1978). Generative, ambient music built on feedback loops and time-shifted tape delays. Coined the term "generative music."

**Camille Norment**: *Triplight* and *Siren*. Immersive installations that use resonance, interference, and psychoacoustics as sculptural material.
]
]
